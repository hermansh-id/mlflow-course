[project]
name = "house-price-predictor"
version = "0.1.0"
description = "MLflow hands-on: California housing price prediction"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mlflow>=2.16,<3",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "requests>=2.31",
    "sqlalchemy>=2.0,<2.1",
    "starlette<1.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
